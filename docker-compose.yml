services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =========================
  # CONFIG SERVER
  # =========================
  configsvr:
    image: mongo:7
    container_name: configsvr
    ports:
      - "27019:27019"
    volumes:
      - configsvr_data:/data/db
    command: mongod --configsvr --replSet configReplSet --port 27019 --bind_ip_all

  # =========================
  # SHARD 1 — Replicaset de 3 instancias
  # =========================
  shard1a:
    image: mongo:7
    container_name: shard1a
    ports:
      - "27018:27018"
    volumes:
      - shard1a_data:/data/db
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all

  shard1b:
    image: mongo:7
    container_name: shard1b
    volumes:
      - shard1b_data:/data/db
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all

  shard1c:
    image: mongo:7
    container_name: shard1c
    volumes:
      - shard1c_data:/data/db
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all

  # =========================
  # SHARD 2 — Replicaset de 3 instancias
  # =========================
  shard2a:
    image: mongo:7
    container_name: shard2a
    ports:
      - "27020:27020"
    volumes:
      - shard2a_data:/data/db
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020 --bind_ip_all

  shard2b:
    image: mongo:7
    container_name: shard2b
    volumes:
      - shard2b_data:/data/db
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020 --bind_ip_all

  shard2c:
    image: mongo:7
    container_name: shard2c
    volumes:
      - shard2c_data:/data/db
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020 --bind_ip_all

  # =========================
  # ROUTER (MONGOS)
  # =========================
  mongos:
    image: mongo:7
    container_name: mongos
    ports:
      - "27117:27017"
    depends_on:
      - configsvr
      - shard1a
      - shard1b
      - shard1c
      - shard2a
      - shard2b
      - shard2c
    command: mongos --configdb configReplSet/configsvr:27019 --port 27017 --bind_ip_all

  # =========================
  # INIT SCRIPTS
  # =========================
  mongo-init:
    image: mongo:7
    container_name: mongo-init
    depends_on:
      - configsvr
      - shard1a
      - shard1b
      - shard1c
      - shard2a
      - shard2b
      - shard2c
      - mongos
    volumes:
      - ./mongo-init:/scripts
    entrypoint: ["bash", "/scripts/init.sh"]

  app:
    image: gradle:8.5-jdk21
    container_name: book-libre-api
    working_dir: /app
    volumes:
      - .:/app
    command: gradle --no-daemon bootRun
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes


volumes:
  redis_data:
  postgres_data:
  configsvr_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
